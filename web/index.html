<!doctype html>
<!-- Glossy is the default, declared here as well as in App so the first
     painted frame is already the right colour. Without it the page loads on
     the :root palette and repaints once React mounts - a flash of the wrong
     terminal on every cold load. -->
<html lang="en" data-theme="glossy">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ff2d78'/><stop offset='0.55' stop-color='%23c264ff'/><stop offset='1' stop-color='%2335d6ef'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='url(%23g)'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='800' fill='%2305070e' text-anchor='middle'>D</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiaNurFx — Gold Scalping Workstation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
