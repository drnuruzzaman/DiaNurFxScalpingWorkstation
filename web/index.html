<!doctype html>

     painted frame is already the right colour. Without it the page loads on
     the :root palette and repaints once React mounts - a flash of the wrong
     terminal on every cold load. -->

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' fill='%23171C8F'/%3E%3Crect x='17' y='2' width='13' height='13' fill='%23FF9E1B'/%3E%3Crect x='2' y='17' width='13' height='13' fill='%2393C90F'/%3E%3Crect x='17' y='17' width='13' height='13' fill='%23E31C79'/%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiaNurFx — Gold Scalping Workstation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
